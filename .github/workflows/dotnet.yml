name: Build and Deploy

on:
  push:
    branches:
      - main


jobs:

  build-deploy:

    runs-on: windows-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'


    - name: Restore
      run: dotnet restore TransLedger.sln


    - name: Build
      run: dotnet build TransLedger.sln --configuration Release

    - name: Publish
      run: dotnet publish TransLedger.csproj -c Release -o ./publish


    - name: Deploy to SmarterASP FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
